global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "telegram-alerts"
  routes:
    - match:
        severity: critical
      receiver: "telegram-alerts"
      continue: true

receivers:
  - name: "telegram-alerts"
    telegram_configs:
      - bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
        chat_id: -1001234567890
        parse_mode: "HTML"
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔥 <b>[ALERT - {{ .Status | toUpper }}]</b>{{ else }}✅ <b>[RESOLVED]</b>{{ end }}
          <b>Alert:</b> {{ .CommonAnnotations.summary }}
          <b>Severity:</b> <code>{{ .CommonLabels.severity }}</code>
          <b>Description:</b> {{ .CommonAnnotations.description }}
          <b>Timestamp:</b> <code>{{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}</code>
